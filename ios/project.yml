# XcodeGen-Projektdefinition – erzeugt Cappuccino.xcodeproj
# Aufruf (auf dem Mac):  xcodegen generate
name: Cappuccino
options:
  bundleIdPrefix: de.cappuccino
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # eigenes Team in Xcode wählen
targets:
  Cappuccino:
    type: application
    platform: iOS
    sources:
      - Cappuccino
    info:
      path: Cappuccino/Info.plist
      properties:
        CFBundleDisplayName: Cappuccino
        NSCameraUsageDescription: Cappuccino benötigt die Kamera, um Schwarz-Weiß-Fotos aufzunehmen.
        NSPhotoLibraryAddUsageDescription: Cappuccino speichert deine Aufnahmen in deiner Mediathek. Lesezugriff ist nicht nötig.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiredDeviceCapabilities:
          - still-camera
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.cappuccino.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - CappuccinoTests
  CappuccinoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CappuccinoTests
    dependencies:
      - target: Cappuccino
